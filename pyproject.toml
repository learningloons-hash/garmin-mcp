[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Read-only MCP server for personal Garmin Connect data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mark Lee" }]
dependencies = [
    "garminconnect==0.3.20",
    "mcp==2.3.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
